name: Public Pages verification
on:
  push:
    branches: [dev]
    paths:
      - "index.html"
      - "docs/**"
      - ".github/workflows/pages-smoke.yml"
  workflow_dispatch:
concurrency:
  group: pages-public-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check-public-website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed root or compatibility redirect and real GLB
        shell: bash
        run: |
          set -euo pipefail
          base="https://siliconyc.github.io/OpenModels"
          for attempt in $(seq 1 12); do
            curl -fLSs --max-time 18 "${base}/" -o /tmp/public-home || true
            if grep -q 'id="stage"' /tmp/public-home; then
              prefix="${base}"
              mode="canonical /docs Pages source"
            elif grep -q "location.replace('./docs/'" /tmp/public-home; then
              prefix="${base}/docs"
              mode="root fallback redirect to /docs"
            else
              prefix=""
              mode="wrong Pages source or deployment not propagated"
            fi
            if [ -n "$prefix" ]; then
              http="true"
              for path in "index.html" "app.js" "models.json" "assets/test-cube.glb" "assets/tiger-i-grey.glb" "assets/tiger-i-uv.glb"; do
                if ! curl -fLSs --max-time 18 "${prefix}/${path}" -o "/tmp/page-${path//\//_}"; then
                  http="false"
                  break
                fi
              done
              if [ "$http" = "true" ] && grep -q 'id="stage"' /tmp/page-index.html && grep -q GLTFLoader /tmp/page-app.js; then
                if ! grep -q '"id": "tiger-i-uv"' /tmp/page-models.json; then
                echo "UV catalog deployment pending, retry..."
                sleep 10
                continue
              fi
              echo "Source mode: $mode"
                export TEST_PREFIX="$prefix"
                python - <<'PY'
          import json,struct,os
          for file in ('test-cube', 'tiger-i-grey', 'tiger-i-uv'):
              p=open('/tmp/page-assets_'+file+'.glb','rb').read()
              assert p[:4]==b'glTF' and struct.unpack_from('<II',p,4)==(2,len(p)),file
          m=json.load(open('/tmp/page-models.json'))
          assert {'test-cube','tiger-i-grey','tiger-i-uv'}.issubset({v['id'] for v in m['models']})
          print('PASS: live Pages viewer, model catalog and three genuine GLBs including UV')
          print('Public asset base:',os.environ['TEST_PREFIX'])
          PY
                exit 0
              fi
            fi
            echo "Attempt $attempt: $mode; retrying to allow Pages deployment" 
            sleep 10
          done
          echo "FAIL: public Pages does not serve viewer. ROOT first 350 bytes:"
          head -c 350 /tmp/public-home
          exit 1
