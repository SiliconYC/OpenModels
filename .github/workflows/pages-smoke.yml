name: Public Pages verification
on:
  push:
    branches: [dev]
    paths:
      - "index.html"
      - "sprites.html"
      - "3d.html"
      - "docs/**"
      - ".github/workflows/pages-smoke.yml"
  workflow_dispatch:
concurrency:
  group: pages-public-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check-public-website:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live root and published assets (either Pages source setting)
        shell: bash
        run: |
          set -euo pipefail
          base="https://siliconyc.github.io/OpenModels"
          mkdir -p /tmp/openmodels-public
          ready=false
          for attempt in $(seq 1 18); do
            prefix=""
            if curl -fLsS --max-time 15 "$base/sprites-catalog.json" -o /tmp/openmodels-public/sprites-catalog.json 2>/dev/null; then
              prefix="$base"; home_file="docs/index.html"
            elif curl -fLsS --max-time 15 "$base/docs/sprites-catalog.json" -o /tmp/openmodels-public/sprites-catalog.json 2>/dev/null; then
              prefix="$base/docs";home_file="index.html"
            fi
            ok=true
            if [ -z "$prefix" ]; then ok=false; fi
            if [ "$ok" = true ]; then
              for file in index.html sprites.html 3d.html; do
                curl -fLsS --max-time 15 "$base/$file" -o "/tmp/openmodels-public/root-$file" || { ok=false; break; }
              done
            fi
            if [ "$ok" = true ]; then
              for file in sprites.html 3d.html assets/sprites/fixture-compass/integrated/manifest.json assets/sprites/fixture-compass/integrated/frames/000.png assets/test-cube.glb assets/tiger-i-uv.glb; do
                curl -fLsS --max-time 15 "$prefix/$file" -o "/tmp/openmodels-public/${file//\//_}" || { ok=false;break; }
              done
            fi
            if [ "$ok" = true ] &&
               cmp -s "$home_file" /tmp/openmodels-public/root-index.html &&
               cmp -s docs/assets/sprites/fixture-compass/integrated/frames/000.png /tmp/openmodels-public/assets_sprites_fixture-compass_integrated_frames_000.png &&
               grep -q 'class="choices"' /tmp/openmodels-public/root-index.html &&
               grep -q 'id="stage"' /tmp/openmodels-public/3d.html &&
               grep -q 'id="sprite-canvas"' /tmp/openmodels-public/sprites.html; then
              ready=true
              echo "PASS: current Pages source $prefix and 200 HTTP assets"
              break
            fi
            echo "Attempt $attempt: awaiting current root/pages deployment"
            sleep 10
          done
          if [ "$ready" != true ];then echo 'FAIL: public website not serving latest dual entry';exit 1;fi
          python - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('/tmp/openmodels-public')
          m=json.loads((p/'assets_sprites_fixture-compass_integrated_manifest.json').read_text())
          c=json.loads((p/'sprites-catalog.json').read_text())
          assert m['heading_slots']==64 and m['available_levels']==[16,32,64]
          assert c['assets'][0]['release_status']=='fixture' and c['assets'][1]['release_status']=='planned'
          png=(p/'assets_sprites_fixture-compass_integrated_frames_000.png').read_bytes()
          assert png[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack_from('>II',png,16)==(96,96) and png[25]==6
          glb=(p/'assets_test-cube.glb').read_bytes()
          assert glb[:4]==b'glTF' and struct.unpack_from('<II',glb,4)==(2,len(glb))
          print('PASS: canonical root portal, true PNG fixture/manifest and unchanged GLB')
          PY
      - run: npm install --no-save --no-package-lock puppeteer-core@24.25.0
      - name: Run real Chrome against canonical public links
        run: node tests/acceptance-sprites.mjs
        env:
          OPENMODELS_BASE: https://siliconyc.github.io/OpenModels/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue32-public-pages-chrome
          path: acceptance/
          retention-days: 21
