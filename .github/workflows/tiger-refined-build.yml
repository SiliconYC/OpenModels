name: Tiger I refinement one-shot cloud geometry and UV build
on:
  push:
    branches: [feat-19-tiger-detailed-geometry-20261017]
    paths:
      - 'models/vehicles/land/tiger-i/source/build_refined.py'
      - 'models/vehicles/land/tiger-i/source/build_refined_uv.py'
      - '.github/workflows/tiger-refined-build.yml'
concurrency:
  group: tiger-refined-generator-19
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cloud-only dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh pillow
      - name: Build detailed actual mesh and reloaded UV GLB
        run: |
          python models/vehicles/land/tiger-i/source/build_refined.py
          python models/vehicles/land/tiger-i/source/build_refined_uv.py
      - name: Require both baseline and refined geometry/texture tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit reproducible true meshes, PNG and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/vehicles/land/tiger-i/export/tiger-i-refined-grey.glb
          git add models/vehicles/land/tiger-i/export/tiger-i-refined-uv.glb
          git add models/vehicles/land/tiger-i/export/refined-mesh-report.json
          git add models/vehicles/land/tiger-i/export/refined-uv-report.json
          git add models/vehicles/land/tiger-i/textures/tiger-i-refined-checker.png
          git add models/vehicles/land/tiger-i/textures/tiger-i-refined-uv-template.png
          git add models/vehicles/land/tiger-i/textures/refined-uv-layout.json
          git add docs/assets/tiger-i-refined-grey.glb docs/assets/tiger-i-refined-uv.glb
          if ! git diff --staged --quiet; then
            git commit -m 'build(#19): deliver measured refined Tiger mesh and real 4K UV GLB'
            git fetch origin feat-19-tiger-detailed-geometry-20261017
            git rebase origin/feat-19-tiger-detailed-geometry-20261017
            git push origin HEAD:feat-19-tiger-detailed-geometry-20261017
          fi
